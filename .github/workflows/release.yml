# Builds static binaries for linux/amd64 and linux/arm64 whenever a v*
# tag is pushed. Ships each binary twice: stripped original and
# UPX-compressed variant, so users can choose.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build binaries (amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "clustercheck-linux-${arch}" ./cmd/clustercheck
            upx --best --lzma -o "clustercheck-linux-${arch}-upx" "clustercheck-linux-${arch}"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            clustercheck-linux-amd64 \
            clustercheck-linux-arm64 \
            clustercheck-linux-amd64-upx \
            clustercheck-linux-arm64-upx
